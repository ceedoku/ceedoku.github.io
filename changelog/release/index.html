			/* Title bar */

			.titlebar {
				width: 100%;
				height: 80px;
				display: flex;
				align-items: center;
				padding: 10px 20px;
				background: var(--surface);
				box-shadow: var(--shadow);
			}

			.logo {
				height: 60px;
			}

			.desktop-menu {
				margin-left: auto;
				display: flex;
				gap: 25px;
			}

			.desktop-menu a,
			.mobile-sidebar a {
				color: var(--text);
				text-decoration: none;
			}

			.desktop-menu a:hover,
			.mobile-sidebar a:hover {
				color: var(--blue);
			}


			/* Mobile button */

			.menu-button {
				display: none;
				margin-left: auto;
				background: none;
				border: none;
				color: var(--text);
				font-size: 32px;
				cursor: pointer;
			}


			/* Mobile sidebar */

			.mobile-sidebar {
				position: fixed;
				top: 0;
				left: -280px;

				width: 280px;
				height: 100dvh;

				background: var(--surface);

				display: flex;
				flex-direction: column;
				gap: 20px;

				padding: 20px;

				transition: left .3s ease;

				z-index: 1000;
			}

			.titlebar {
				position: sticky;
				top: 0;
			}

			.mobile-sidebar.open {
				left: 0;
			}
			.sidebar-spacer {
				flex: 1;
			}

			.close-menu {
				background: none;
				border: 1px solid var(--text);
				color: var(--text);
				padding: 10px;
				border-radius: 8px;
				cursor: pointer;
				font-size: 16px;
			}

			.close-menu:hover {
				color: var(--blue);
			}

			.sidebar-logo {
				width: 200px;
				margin-bottom: 20px;
			}
			.menu-button {
				display: none;
				background: none;
				border: none;
				color: var(--text);
				font-size: 32px;
				cursor: pointer;
			}
			.why {
				margin-left: 10px;
				margin-right: 10px
			}
			#markdown-content {
				margin-left: 10px;
				margin-right: 10px
			}

			#markdown-content.something blockquote {
				margin-left: 15px;
			}

			#markdown-content.something h3 {
				margin-bottom: 10px;
				margin-left: 5px;
			}

			#downloadbox > div > div {
				margin-right: auto;
			}

			/* Mobile layout */
			@media (max-width: 700px) {
				#downloadbox > div > div {
					margin-right: unset;
				}
				.titlebar {
					display: none;
				}

				.menu-button {
					display: block;
					position: absolute;
					top: 10px;
					left: 15px;
					z-index: 999;
					margin-top: 8px
					margin: 0;
					padding: 0;
				}


				.img {
				width: 80%;
				transform: translatex(20vw);
				margin-top: 5px
				}
			}

			// this script sets the size of the download icon
			const downloadIcon = document.getElementById("downloadicon");
			const downloadText = document.getElementById("downloadtext");

			function sizeDownloadIcon() {
				downloadIcon.style.display = "none";

				requestAnimationFrame(() => {
					const height = downloadText.getBoundingClientRect().height;

					downloadIcon.style.height = height + "px";
					downloadIcon.style.width = height + "px";

					downloadIcon.style.display = "flex";
				});
			}

			sizeDownloadIcon();
			window.addEventListener("resize", sizeDownloadIcon);

		<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js">

		<script>
			// this script just exists so the sidebar menu can be toggled
			function toggleMenu() {
				document.getElementById("sidebar").classList.toggle("open");
			}


			document.addEventListener("click", function(event) {

				const sidebar = document.getElementById("sidebar");
				const button = document.querySelector(".menu-button");

				if (
					sidebar.classList.contains("open") &&
					!sidebar.contains(event.target) &&
					!button.contains(event.target)
				) {
					sidebar.classList.remove("open");
				}

			});
		</script>
		<script>
			// this script loads the release info page if ?v=an_actual_release_number
			async function loadReleaseChangelog() {

				const params = new URLSearchParams(window.location.search);
				const requestedVersion = params.get("v");

				if (!requestedVersion) {
					downloadBox.style.display = "none";
					downloadBox.classList.remove("show");
					return;
				}

				const version = requestedVersion.replace(/^v/i, "");

				const url =
					version.toLowerCase() === "latest"
						? "https://api.github.com/repos/ceebug/Ceedoku/releases/latest"
						: `https://api.github.com/repos/ceebug/Ceedoku/releases/tags/v${encodeURIComponent(version)}`;

				try {

					const response = await fetch(url);

					if (!response.ok) {
						// redirect to https://ceedoku.github.io/changelog
						return;
					}

					const release = await response.json();
					const markdownContent = document.getElementById("markdown-content");
					const heading = document.querySelector(".about-container > h2");
					const releaseVersion = release.name.replace(/^Ceedoku\s+/i, "");

					if (heading) {
						heading.textContent =
							`Version ${releaseVersion}`;
					}
					
					document.title = `Ceedoku • Changelogs - Version ${releaseVersion}`

					markdownContent.classList.add("something");

					const changelog =
						(release.body || "")
							.split(/\r?\n/)
							.slice(1)
							.join("\n");

					markdownContent.innerHTML =
						"<h3>Release Changelog</h3>" +
						marked.parse(changelog);

					const offlineAsset =
						release.assets.find(asset =>
							asset.name.toLowerCase().endsWith(".zip")
						);

					const downloadLink = document.getElementById("downloadboxlink");

					if (downloadLink && offlineAsset) {

						downloadLink.href =
							offlineAsset.browser_download_url;


					} else {
						window.location.replace("https://ceedoku.github.io/changelog");
						return;
					}

				} catch (error) {
					window.location.replace("https://ceedoku.github.io/changelog");
					return;
				}
			}

			loadReleaseChangelog();
		</script>
