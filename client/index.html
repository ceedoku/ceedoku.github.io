<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ceedoku • Installer Download</title>
<link href="data:image/svg+xml;base64,..." rel="icon" type="image/svg+xml">
<style>
:root {
    color-scheme: dark;
    --bg: #0b0d11;
    --surface: #13161c;
    --surface-2: #191d25;
    --surface-3: #222733;
    --text: #f5f7fb;
    --text-2: #c4c9d3;
    --muted: #818895;
    --blue: #4d8dff;
    --windows: #4d8dff;
    --macos: #c7d0ff;
    --linux: #f2a33b;
    --border: rgba(255, 255, 255, 0.075);
    --page-radius: 24px;
    --item-radius: 18px;
    --icon-radius: 14px;
    --button-radius: 12px;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    min-height: 100%;
}

body {
    min-height: 100vh;
    background:
        radial-gradient(circle at 20% 10%, rgba(77, 141, 255, 0.10), transparent 30%),
        radial-gradient(circle at 80% 90%, rgba(77, 141, 255, 0.07), transparent 30%),
        var(--bg);
    color: var(--text);
    font-family:
        Inter,
        ui-sans-serif,
        system-ui,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        sans-serif;
    overflow-x: hidden;
}

body::before {
    content: "";
    position: fixed;
    inset: 0;
    pointer-events: none;
    background:
        linear-gradient(
            115deg,
            transparent 0%,
            rgba(255, 255, 255, 0.015) 50%,
            transparent 100%
        );
    animation: ambient 12s ease-in-out infinite alternate;
}

@keyframes ambient {
    from {
        opacity: 0.35;
        transform: translateX(-2%);
    }

    to {
        opacity: 0.75;
        transform: translateX(2%);
    }
}

.page {
    width: min(100% - 32px, 960px);
    margin: 0 auto;
    padding: 56px 0 40px;
    position: relative;
    z-index: 1;
}

header {
    text-align: center;
    margin-bottom: 42px;
}

.logo {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 74px;
    height: 74px;
    margin-bottom: 20px;
    border-radius: 20px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    box-shadow:
        0 20px 50px rgba(0, 0, 0, 0.30),
        inset 0 1px rgba(255, 255, 255, 0.04);
}

.logo svg {
    width: 42px;
    height: 42px;
}

h1 {
    margin: 0;
    font-size: clamp(2rem, 5vw, 3rem);
    line-height: 1.05;
    letter-spacing: -0.04em;
}

.subtitle {
    margin: 13px auto 0;
    color: var(--text-2);
    font-size: 1rem;
    max-width: 560px;
    line-height: 1.6;
}

.version {
    display: inline-flex;
    margin-top: 16px;
    padding: 7px 11px;
    border-radius: 999px;
    background: rgba(77, 141, 255, 0.10);
    border: 1px solid rgba(77, 141, 255, 0.18);
    color: #a9c6ff;
    font-size: 0.82rem;
    font-weight: 600;
}

.download-card {
    position: relative;
    overflow: hidden;
    padding: 26px;
    border-radius: var(--page-radius);
    background: rgba(19, 22, 28, 0.88);
    border: 1px solid var(--border);
    box-shadow:
        0 30px 80px rgba(0, 0, 0, 0.28),
        inset 0 1px rgba(255, 255, 255, 0.035);
    backdrop-filter: blur(18px);
}

.download-card::before {
    content: "";
    position: absolute;
    inset: 0;
    pointer-events: none;
    background:
        radial-gradient(
            circle at 50% -30%,
            rgba(77, 141, 255, 0.08),
            transparent 45%
        );
}

.section-title {
    position: relative;
    margin: 0 0 16px;
    font-size: 0.85rem;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.09em;
    font-weight: 700;
}

.os-grid {
    position: relative;
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
}

.os-option {
    appearance: none;
    border: 1px solid var(--border);
    border-radius: var(--item-radius);
    padding: 20px;
    background: var(--surface-2);
    color: var(--text);
    text-align: left;
    cursor: pointer;
    transition:
        transform 160ms ease,
        border-color 160ms ease,
        background 160ms ease,
        box-shadow 160ms ease;
}

.os-option:hover {
    transform: translateY(-2px);
    background: var(--surface-3);
}

.os-option:focus-visible {
    outline: 3px solid rgba(77, 141, 255, 0.55);
    outline-offset: 2px;
}

.os-option.selected {
    background: var(--surface-3);
}

.os-option.windows.selected {
    border-color: rgba(77, 141, 255, 0.60);
    box-shadow: 0 14px 40px rgba(77, 141, 255, 0.10);
}

.os-option.macos.selected {
    border-color: rgba(199, 208, 255, 0.48);
    box-shadow: 0 14px 40px rgba(199, 208, 255, 0.08);
}

.os-option.linux.selected {
    border-color: rgba(242, 163, 59, 0.58);
    box-shadow: 0 14px 40px rgba(242, 163, 59, 0.09);
}

.os-icon {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 48px;
    height: 48px;
    margin-bottom: 16px;
    border-radius: var(--icon-radius);
    background: rgba(255, 255, 255, 0.045);
}

.os-icon svg {
    width: 27px;
    height: 27px;
}

.os-option.windows .os-icon {
    color: var(--windows);
}

.os-option.macos .os-icon {
    color: var(--macos);
}

.os-option.linux .os-icon {
    color: var(--linux);
}

.os-name {
    font-size: 1rem;
    font-weight: 700;
}

.os-description {
    margin-top: 5px;
    color: var(--muted);
    font-size: 0.82rem;
}

.arch-section {
    position: relative;
    margin-top: 28px;
}

.arch-grid {
    display: grid;
    gap: 10px;
}

.arch-option {
    appearance: none;
    width: 100%;
    border: 1px solid var(--border);
    border-radius: var(--item-radius);
    padding: 17px 18px;
    background: var(--surface-2);
    color: var(--text);
    cursor: pointer;
    text-align: left;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
    transition:
        transform 160ms ease,
        border-color 160ms ease,
        background 160ms ease;
}

.arch-option:hover {
    transform: translateY(-1px);
    background: var(--surface-3);
}

.arch-option:focus-visible {
    outline: 3px solid rgba(77, 141, 255, 0.55);
    outline-offset: 2px;
}

.arch-option.selected {
    border-color: rgba(77, 141, 255, 0.55);
    background: var(--surface-3);
}

.arch-info {
    min-width: 0;
}

.arch-name {
    font-weight: 700;
}

.arch-description {
    margin-top: 4px;
    color: var(--muted);
    font-size: 0.8rem;
}

.arch-badge {
    flex: 0 0 auto;
    padding: 6px 9px;
    border-radius: 8px;
    background: rgba(255, 255, 255, 0.055);
    color: var(--text-2);
    font-size: 0.72rem;
    font-weight: 700;
}

.download-area {
    position: relative;
    margin-top: 26px;
}

.download-button {
    width: 100%;
    min-height: 56px;
    border: 0;
    border-radius: var(--button-radius);
    background: var(--blue);
    color: white;
    font: inherit;
    font-weight: 750;
    font-size: 0.98rem;
    cursor: pointer;
    box-shadow:
        0 12px 30px rgba(77, 141, 255, 0.20),
        inset 0 1px rgba(255, 255, 255, 0.16);
    transition:
        transform 150ms ease,
        filter 150ms ease,
        opacity 150ms ease;
}

.download-button:hover {
    filter: brightness(1.08);
    transform: translateY(-1px);
}

.download-button:active {
    transform: translateY(1px) scale(0.995);
}

.download-button:focus-visible {
    outline: 3px solid rgba(77, 141, 255, 0.45);
    outline-offset: 3px;
}

.download-button:disabled {
    cursor: default;
    opacity: 0.55;
    transform: none;
    filter: none;
}

.progress {
    display: none;
    margin-top: 14px;
}

.progress.active {
    display: block;
}

.progress-track {
    height: 8px;
    overflow: hidden;
    border-radius: 999px;
    background: rgba(255, 255, 255, 0.06);
}

.progress-bar {
    width: 0%;
    height: 100%;
    border-radius: inherit;
    background: linear-gradient(
        90deg,
        #4d8dff,
        #73a7ff
    );
    transition: width 180ms ease;
}

.progress-text {
    margin-top: 9px;
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
}

.fallback {
    display: none;
    margin-top: 14px;
    text-align: center;
    color: var(--muted);
    font-size: 0.8rem;
    line-height: 1.5;
}

.fallback a {
    color: #9dbdff;
}

footer {
    margin-top: 28px;
    text-align: center;
    color: var(--muted);
    font-size: 0.78rem;
}

@media (max-width: 700px) {
    .page {
        width: min(100% - 20px, 960px);
        padding-top: 30px;
    }

    header {
        margin-bottom: 28px;
    }

    .download-card {
        padding: 18px;
        border-radius: 20px;
    }

    .os-grid {
        grid-template-columns: 1fr;
    }

    .os-option {
        display: flex;
        align-items: center;
        gap: 15px;
        padding: 15px;
    }

    .os-icon {
        flex: 0 0 auto;
        width: 44px;
        height: 44px;
        margin-bottom: 0;
    }
}

@media (prefers-reduced-motion: reduce) {
    *,
    *::before,
    *::after {
        animation-duration: 0.001ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: 0.001ms !important;
    }
}
</style>
</head>

<body>

<div class="page">

<header>
    <div class="logo">
        <svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="8" y="8" width="48" height="48" rx="13" fill="#4D8DFF"/>
            <path d="M22 21H42V28H29V36H40V43H29V50H22V21Z" fill="white"/>
        </svg>
    </div>

    <h1>Download Ceedoku</h1>

    <div class="subtitle">
        Get the latest Ceedoku Client installer for your operating system.
    </div>

    <div class="version" id="version">
        Client
    </div>
</header>

<main class="download-card">

    <div class="section-title">
        Operating system
    </div>

    <div class="os-grid">

        <button class="os-option windows selected" data-os="windows">
            <div class="os-icon">
                <svg viewBox="0 0 24 24" fill="currentColor">
                    <path d="M2 4.5L10.5 3.3V11H2V4.5ZM11.5 3.15L22 1.7V11H11.5V3.15ZM2 12H10.5V19.7L2 18.5V12ZM11.5 12H22V22.3L11.5 20.85V12Z"/>
                </svg>
            </div>

            <div>
                <div class="os-name">Windows</div>
                <div class="os-description">Windows 10 and newer</div>
            </div>
        </button>

        <button class="os-option macos" data-os="macos">
            <div class="os-icon">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M7.5 18.5C5.8 16.7 5 14.1 5.5 11.8C6 9.3 8.2 7.6 10.4 7.6C11.7 7.6 12.5 8.4 13.5 8.4C14.5 8.4 15.5 7.6 16.8 7.6C18.2 7.6 19.6 8.4 20.5 9.7C17.5 11.3 17.1 15.5 20.5 16.8C19.9 18.2 19 19.6 17.8 20.8C16.8 21.8 15.8 22.8 14.3 22.8C12.9 22.8 12.5 21.9 10.8 21.9C9.1 21.9 8.6 22.8 7.2 22.8C5.7 22.8 4.6 21.7 3.6 20.6C0.6 17.3 0.2 12.3 2.8 9.4C4.1 7.9 6.1 7 8 7C9.4 7 10.7 7.8 11.5 7.8C12.3 7.8 13.8 6.9 15.4 7C16.1 7 18.1 7.3 19.4 9.1C16.4 10.9 16.9 14.8 20 16C19.5 17.1 18.9 18.2 18.1 19.2"/>
                    <path d="M14.8 4.5C15.6 3.5 16.8 2.8 18 2.7C18.1 4 17.6 5.2 16.8 6.1C16 7 14.8 7.6 13.6 7.5C13.5 6.3 14 5.4 14.8 4.5Z"/>
                </svg>
            </div>

            <div>
                <div class="os-name">macOS</div>
                <div class="os-description">Intel and Apple Silicon</div>
            </div>
        </button>

        <button class="os-option linux" data-os="linux">
            <div class="os-icon">
                <svg viewBox="0 0 64 64" fill="currentColor">
                    <path d="M31.9 4C23.4 4 19 10.7 19 20.8C19 29.1 15.7 34.4 11.8 39.8C8.9 43.8 5.5 48.3 6.8 53.1C8.1 58 14.2 60 21.4 58.1C26.1 56.9 29.4 54.7 31.9 54.7C34.5 54.7 37.7 56.9 42.4 58.1C49.7 60 55.7 58 57 53.1C58.3 48.3 54.9 43.8 52 39.8C48.1 34.4 44.8 29.1 44.8 20.8C44.8 10.7 40.4 4 31.9 4ZM23.3 20.5C21.6 20.5 20.3 19.2 20.3 17.5C20.3 15.8 21.6 14.5 23.3 14.5C25 14.5 26.3 15.8 26.3 17.5C26.3 19.2 25 20.5 23.3 20.5ZM40.5 20.5C38.8 20.5 37.5 19.2 37.5 17.5C37.5 15.8 38.8 14.5 40.5 14.5C42.2 14.5 43.5 15.8 43.5 17.5C43.5 19.2 42.2 20.5 40.5 20.5ZM25.1 27.5C27.2 29.6 36.7 29.6 38.8 27.5C39.8 26.5 41.2 27.2 40.7 28.8C39.7 32 35.9 34.2 32 34.2C28.1 34.2 24.3 32 23.3 28.8C22.8 27.2 24.1 26.5 25.1 27.5Z"/>
                </svg>
            </div>

            <div>
                <div class="os-name">Linux</div>
                <div class="os-description">AppImage packages</div>
            </div>
        </button>

    </div>

    <div class="arch-section">

        <div class="section-title">
            Architecture
        </div>

        <div class="arch-grid" id="archGrid"></div>

    </div>

    <div class="download-area">

        <button class="download-button" id="downloadButton" disabled>
            Loading latest release…
        </button>

        <div class="progress" id="progress">

            <div class="progress-track">
                <div class="progress-bar" id="progressBar"></div>
            </div>

            <div class="progress-text" id="progressText">
                Preparing download…
            </div>

        </div>

        <div class="fallback" id="fallback">
            If the download does not start automatically,
            <a id="fallbackLink" href="#" target="_blank" rel="noopener">
                click here
            </a>.
        </div>

    </div>

</main>

<footer id="footerVersion">
    Ceedoku Client
</footer>

</div>

<script>
let RELEASE_TAG = null;
let RELEASE_BASE = null;

const downloads = {
    windows: {
        x64: {
            filename: "Ceedoku-Installer_Windows-x64.exe",
            meta: "64-bit Intel/AMD",
        },
        x86: {
            filename: "Ceedoku-Installer_Windows-x86.exe",
            meta: "32-bit Intel/AMD",
        },
        arm64: {
            filename: "Ceedoku-Installer_Windows-arm64.exe",
            meta: "ARM64",
        }
    },

    macos: {
        universal: {
            filename: "Ceedoku-Installer_MacOS-universal.dmg",
            meta: "Intel + Apple Silicon",
        }
    },

    linux: {
        x64: {
            filename: "Ceedoku-Installer_Linux-x64.AppImage",
            meta: "64-bit Intel/AMD",
        },
        arm64: {
            filename: "Ceedoku-Installer_Linux-arm64.AppImage",
            meta: "ARM64",
        },
        arm32: {
            filename: "Ceedoku-Installer_Linux-arm32.AppImage",
            meta: "ARM 32-bit",
        }
    }
};

const osOptions = document.querySelectorAll(".os-option");
const archGrid = document.getElementById("archGrid");
const downloadButton = document.getElementById("downloadButton");
const progress = document.getElementById("progress");
const progressBar = document.getElementById("progressBar");
const progressText = document.getElementById("progressText");
const fallback = document.getElementById("fallback");
const fallbackLink = document.getElementById("fallbackLink");
const versionElement = document.getElementById("version");
const footerVersion = document.getElementById("footerVersion");

let selectedOS = "windows";
let selectedArchitecture = "x64";

async function loadLatestRelease() {
    const response = await fetch(
        "https://api.github.com/repos/Ceebug/Ceedoku-Client/releases/latest",
        {
            headers: {
                Accept: "application/vnd.github+json"
            }
        }
    );

    if (!response.ok) {
        throw new Error("Failed to get latest release.");
    }

    const release = await response.json();

    RELEASE_TAG = release.tag_name;

    RELEASE_BASE =
        "https://github.com/Ceebug/Ceedoku-Client/releases/download/" +
        encodeURIComponent(RELEASE_TAG);

    const displayVersion =
        RELEASE_TAG.replace(/^v/i, "");

    versionElement.textContent =
        "Client " + displayVersion;

    footerVersion.textContent =
        "Ceedoku Client " + displayVersion;

    downloadButton.disabled = false;
    downloadButton.textContent = "Download Ceedoku Client";
}

function renderArchitectures() {
    const options = downloads[selectedOS];

    archGrid.innerHTML = "";

    const architectures = Object.entries(options);

    selectedArchitecture = architectures[0][0];

    architectures.forEach(([id, data], index) => {
        const button = document.createElement("button");

        button.className =
            "arch-option" +
            (index === 0 ? " selected" : "");

        button.dataset.architecture = id;

        button.innerHTML = `
            <div class="arch-info">
                <div class="arch-name">${id.toUpperCase()}</div>
                <div class="arch-description">${data.meta}</div>
            </div>
            <div class="arch-badge">${id === "universal" ? "Universal" : id.toUpperCase()}</div>
        `;

        button.addEventListener("click", () => {
            document
                .querySelectorAll(".arch-option")
                .forEach(option => {
                    option.classList.remove("selected");
                });

            button.classList.add("selected");

            selectedArchitecture = id;
        });

        archGrid.appendChild(button);
    });
}

osOptions.forEach(option => {
    option.addEventListener("click", () => {
        osOptions.forEach(item => {
            item.classList.remove("selected");
        });

        option.classList.add("selected");

        selectedOS = option.dataset.os;

        renderArchitectures();
    });
});

async function download() {
    if (!RELEASE_BASE) {
        try {
            await loadLatestRelease();
        } catch {
            downloadButton.textContent =
                "Failed to load latest release";

            return;
        }
    }

    const data =
        downloads[selectedOS][selectedArchitecture];

    const url =
        RELEASE_BASE +
        "/" +
        encodeURIComponent(data.filename);

    progress.classList.add("active");
    fallback.style.display = "none";

    progressBar.style.width = "15%";
    progressText.textContent =
        "Starting download…";

    const link =
        document.createElement("a");

    link.href = url;
    link.download = data.filename;

    document.body.appendChild(link);
    link.click();
    link.remove();

    fallbackLink.href = url;

    setTimeout(() => {
        progressBar.style.width = "100%";
        progressText.textContent =
            "Download started.";
        fallback.style.display = "block";
    }, 500);
}

downloadButton.addEventListener(
    "click",
    download
);

renderArchitectures();

loadLatestRelease().catch(() => {
    downloadButton.disabled = false;
    downloadButton.textContent =
        "Open GitHub Releases";

    downloadButton.onclick = () => {
        window.open(
            "https://github.com/Ceebug/Ceedoku-Client/releases",
            "_blank",
            "noopener"
        );
    };

    versionElement.textContent =
        "Latest release unavailable";
});
</script>

</body>
</html>
