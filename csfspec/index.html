<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSF Specification</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .warning {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            padding: 30px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
        }

        p {
            margin: 0;
            font-size: 18px;
            line-height: 1.5;
        }

        button {
            margin-top: 8px;
            padding: 10px 28px;
            border: none;
            border-radius: 8px;
            background: #fff;
            color: #000;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #ddd;
        }

        button:active {
            transform: scale(0.97);
        }
    </style>
</head>

<body>
    <div class="warning">
        <h1>Please note:</h1>

        <p>
            Opening this PDF <strong>will</strong> flashbang you with a white background.<br>
            Click 'Okay' to proceed.
        </p>

        <button onclick="window.location.href = 'https://ceedoku.github.io/CSF%20Specification%20v1.0.pdf'">
            Okay
        </button>
    </div>
</body>
</html>
