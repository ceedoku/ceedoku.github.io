<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSF Specification</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: #000;
            color: #fff;
            font-family: Arial, sans-serif;

            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
        }

        .warning {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 18px;
            padding: 30px;
        }

        h1 {
            margin: 0;
            font-size: 28px;
        }

        p {
            margin: 0;
            font-size: 18px;
            line-height: 1.5;
        }

        button {
            position: relative;
            margin-top: 0px;
            padding: 10px 28px;
            border: none;
            background: transparent;
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            width: 200px;
            height: 50px;
            z-index: 0;
        }

        button::before {
            content: "";
            position: absolute;
            inset: 0;
            background: #4c4c4c;
            border-radius: 100px;
            z-index: -1;
            transition: background 0.2s ease, transform 0.45s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        button:hover::before {
            background: #383838;
        }

        button:active::before {
            transform: scaleX(1.2) scaleY(1.03);
        }

        button.spring::before {
            animation: buttonSpring 0.5s ease-out;
        }

        @keyframes buttonSpring {
            0%   { transform: scaleX(1.2) scaleY(1.03); }
            30%  { transform: scaleX(0.92) scaleY(0.98); }
            55%  { transform: scaleX(1.12) scaleY(1.01); }
            78%  { transform: scaleX(0.97) scaleY(0.99); }
            100% { transform: scaleX(1) scaleY(1); }
        }
    </style>
</head>

<body>
    <div class="warning">
        <h1>Please note:</h1>

        <p>
            Opening this PDF <strong>will</strong> flashbang you with a white background.<br>
            Click 'Okay' to proceed.
        </p>

        <button id="okayButton">
            Okay
        </button>
    </div>
    <script>
        const button = document.getElementById("okayButton");

        button.addEventListener("pointerdown", () => {
            button.classList.remove("spring");
        });

        button.addEventListener("pointerup", () => {
            button.classList.add("spring");

            setTimeout(() => {
                window.location.href = "https://ceedoku.github.io/CSF%20Specification%20v1.0.pdf";
            }, 500);
        });
    </script>
</body>
</html>
